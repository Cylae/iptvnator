name: Resource Hardening Regression Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

# Keep PR feedback responsive while ensuring master runs are never cancelled.
concurrency:
  group: resource-hardening-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        project:
          - electron-backend
          - web-backend
          - web

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Run project Jest suite
        run: pnpm exec nx test "${{ matrix.project }}" --runInBand

  static-validation:
    name: Typecheck and lint affected applications
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck web and Electron entry points
        run: pnpm run typecheck:ci

      - name: Lint affected applications
        run: pnpm exec nx run-many --target=lint --projects=electron-backend,web-backend,web --parallel=3 --output-style=static
        env:
          CI: true
          NX_TASKS_RUNNER_DYNAMIC_OUTPUT: false

      - name: Validate Nx dependency version policy
        run: pnpm run deps:nx:validate

      - name: Validate stylesheet inputs
        run: pnpm run styles:inputs:validate

      - name: Check translation drift
        run: pnpm run i18n:check

  pwa-and-backend-builds:
    name: PWA and web-backend production builds
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web backend
        run: pnpm exec nx build web-backend

      - name: Build Progressive Web App
        run: pnpm exec nx build web --configuration=pwa
